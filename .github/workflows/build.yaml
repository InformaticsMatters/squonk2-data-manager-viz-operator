---
name: build

# Actions that take place on branches
# or are driven by pull-requests to the main/master branch.
# Here we build container images but don't push them
# and therefore do not require docker credentials.

# -----------------
# Control variables (GitHub Secrets)
# -----------------
#
# (n/a)
#
# -----------
# Environment (GitHub Environments)
# -----------
#
# Environment         (n/a)

on:
  push:
  pull_request:
    branches:
    - 'main'

jobs:
  build:
    runs-on: ubuntu-latest
    # A Postgres with the RDKit cartridge, for the project-database
    # integration tests (tests/test_datacentre_pg.py).
    services:
      postgres:
        image: informaticsmatters/rdkit-cartridge-debian:Release_2024_03_3
        env:
          POSTGRES_PASSWORD: svo-test
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r build-requirements.txt
        pip install -r operator/requirements.txt
    - name: Lint
      run: |
        pre-commit run --all-files
    - name: Test
      env:
        SVO_TEST_PG_URL: postgresql://postgres:svo-test@localhost:5432/postgres
      run: |
        pytest
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: operator
        platforms: linux/amd64,linux/arm64
